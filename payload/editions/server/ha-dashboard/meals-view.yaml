views:
  - title: Meals
    path: meals
    icon: mdi:food
    theme: khione
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.khione_meals_today') }} · Week {{ state_attr('sensor.khione_meals_today', 'week') }} of {{ state_attr('sensor.khione_meals_today', 'total_weeks') }}"
            secondary: "Breakfast: {{ state_attr('sensor.khione_meals_today', 'breakfast') }}\nLunch: {{ state_attr('sensor.khione_meals_today', 'lunch') }}\nSnacks: {{ state_attr('sensor.khione_meals_today', 'snacks') }}\nDinner: {{ state_attr('sensor.khione_meals_today', 'dinner') }}"
            multiline_secondary: true
            icon: mdi:silverware-fork-knife
            icon_color: green
          - type: custom:mushroom-template-card
            primary: Today's Macros
            secondary: "{{ state_attr('sensor.khione_meals_today', 'kcal') }} kcal ({{ state_attr('sensor.khione_meals_today', 'kcal_percent') }}%)\n{{ state_attr('sensor.khione_meals_today', 'protein') }}g protein ({{ state_attr('sensor.khione_meals_today', 'protein_percent') }}%)"
            multiline_secondary: true
            icon: mdi:chart-donut
            icon_color: orange
          - type: custom:mushroom-template-card
            primary: Targets
            secondary: "3×/week running\n90 → 75kg weight goal"
            multiline_secondary: true
            icon: mdi:target
            icon_color: purple
          - type: custom:mushroom-template-card
            primary: Weight
            secondary: "{% if state_attr('sensor.khione_weight', 'configured') %}{{ state_attr('sensor.khione_weight', 'current') }}kg on {{ state_attr('sensor.khione_weight', 'current_date') }}\nLost {{ state_attr('sensor.khione_weight', 'lost') }}kg · {{ state_attr('sensor.khione_weight', 'to_go') }}kg to go ({{ state_attr('sensor.khione_weight', 'percent') }}%)\nMaintenance: ~{{ state_attr('sensor.khione_weight', 'maint') }} kcal/day{% else %}No weigh-ins logged yet.{% endif %}"
            multiline_secondary: true
            icon: mdi:scale-bathroom
            icon_color: blue
          - type: entities
            title: Log Weight
            entities:
              - input_number.khione_weight_kg
          - type: custom:mushroom-template-card
            primary: Log Weight
            icon: mdi:scale-bathroom
            icon_color: blue
            tap_action:
              action: perform-action
              perform_action: pyscript.khione_meals_log_weight
              target: {}
              # No data: block -- tap_action data is static YAML, never
              # Jinja-rendered, so a templated value here would just send
              # the literal template text. The service reads
              # input_number.khione_weight_kg itself instead.
          - type: entities
            title: Weight Profile
            entities:
              - input_number.khione_profile_age
              - input_number.khione_profile_height
              - input_select.khione_profile_sex
              - input_select.khione_profile_activity
          - type: custom:mushroom-template-card
            primary: Save Profile
            icon: mdi:account-cog
            icon_color: purple
            tap_action:
              action: perform-action
              perform_action: pyscript.khione_meals_save_profile
              target: {}
              # No data: block, same reason as Log Weight above -- the
              # service reads all four profile helpers itself.

      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.khione_meals_tonight') }}"
            secondary: "{{ state_attr('sensor.khione_meals_tonight', 'status') }}\n{{ state_attr('sensor.khione_meals_tonight', 'detail') }}\nIngredients: {{ state_attr('sensor.khione_meals_tonight', 'ingredients') }}\nInstructions: {{ state_attr('sensor.khione_meals_tonight', 'instructions') }}\nTomorrow: {{ state_attr('sensor.khione_meals_tonight', 'tomorrow') }}"
            multiline_secondary: true
            icon: mdi:pot-steam
            icon_color: red
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Prev
                icon: mdi:chevron-left
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: pyscript.khione_meals_preview_prev
                  target: {}
              - type: custom:mushroom-template-card
                primary: Today
                icon: mdi:calendar-today
                icon_color: green
                tap_action:
                  action: perform-action
                  perform_action: pyscript.khione_meals_preview_today
                  target: {}
              - type: custom:mushroom-template-card
                primary: Next
                icon: mdi:chevron-right
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: pyscript.khione_meals_preview_next
                  target: {}
          - type: markdown
            title: 📅 This Week
            content: >-
              Week {{ states('sensor.khione_meals_preview') }} of
              {{ state_attr('sensor.khione_meals_preview', 'total_weeks') }}

              {% for d in state_attr('sensor.khione_meals_preview', 'days') or [] %}
              **{{ d.name }}{% if d.is_today %} (today){% endif %}** —
              B: {{ d.breakfast }} · L: {{ d.lunch }} ·
              S: {{ d.snacks }} · D: {{ d.dinner }}

              {% endfor %}
          - type: markdown
            title: 🛒 Shopping List
            content: >-
              {% for section in ['breakfast', 'lunch', 'snacks', 'dinner'] %}
              **{{ section | title }}:** {{ (state_attr('sensor.khione_meals_preview', 'shopping_' + section) or []) | join(', ') }}

              {% endfor %}

      - type: grid
        cards:
          - type: markdown
            title: 🍳 Breakfast Recipes
            content: >-
              {% for r in state_attr('sensor.khione_meals_recipes_breakfast', 'recipes') or [] %}
              **{{ r.name }}** ({{ r.detail }})

              {{ r.ingredients }}

              {% endfor %}
          - type: markdown
            title: 🥪 Lunch Recipes
            content: >-
              {% for r in state_attr('sensor.khione_meals_recipes_lunch', 'recipes') or [] %}
              **{{ r.name }}** ({{ r.detail }})

              {{ r.ingredients }}

              {% endfor %}
          - type: markdown
            title: 🍎 Snack Recipes
            content: >-
              {% for r in state_attr('sensor.khione_meals_recipes_snacks', 'recipes') or [] %}
              **{{ r.name }}** ({{ r.detail }})

              {% endfor %}
          - type: markdown
            title: 🍲 Dinner Recipes
            content: >-
              {% for r in state_attr('sensor.khione_meals_recipes_dinner', 'recipes') or [] %}
              **{{ r.name }}** ({{ r.detail }}){% if r.fresh %} — COOK FRESH{% else %} — batch {{ r.batch }}{% endif %}

              {{ r.ingredients }}

              {% endfor %}
