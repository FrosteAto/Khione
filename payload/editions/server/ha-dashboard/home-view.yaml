views:
  - title: Home
    path: home
    icon: mdi:home
    theme: khione
    # type: sections, not the default masonry: masonry sizes its outer
    # cards to a fixed single-column width (~500px) regardless of nested
    # grid/horizontal-stack children, which is why 3 nested columns stayed
    # squeezed into one narrow strip (confirmed live). sections lay the
    # three columns out side by side across the real view width.
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: clock
            clock_size: medium
            time_format: "24"
          # Calendar card dropped: HA's built-in calendar card requires
          # at least one real entity (confirmed live — an empty
          # entities: [] list throws a config error), and there's no
          # real calendar integration wired up yet. Add one back here
          # once a local_calendar (or real) calendar entity exists.
          - type: weather-forecast
            entity: weather.home
            show_forecast: false
          - type: custom:mushroom-template-card
            primary: Clothing
            secondary: "{{ states('sensor.khione_clothing_recommendation') }}"
            icon: "{{ state_attr('sensor.khione_clothing_recommendation', 'icon') }}"

      - type: grid
        cards:
          - type: custom:rss-news-card
            title: BBC UK / Derbyshire Live
            sources:
              - entity: sensor.khione_rss_bbc
                name: BBC UK News
                color: "#1a73e8"
              - entity: sensor.khione_rss_derbyshire
                name: Derbyshire Live
                color: "#e8731a"
            max_articles: 8
          - type: custom:rss-news-card
            title: Arch Linux News
            sources:
              - entity: sensor.khione_rss_archlinux
                name: Arch Linux News
                color: "#1793d1"
            max_articles: 5

      - type: grid
        cards:
          - type: entities
            title: Services
            entities:
              - entity: binary_sensor.khione_plex
                name: Plex
              - entity: binary_sensor.khione_cockpit
                name: Cockpit
          - type: entities
            title: CPU / Memory
            entities:
              - sensor.system_monitor_processor_use
              - sensor.system_monitor_memory_usage
          - type: markdown
            title: Disks
            content: >-
              {% for d in state_attr('sensor.khione_disks', 'disks') or [] %}
              **{{ d.path }}** — {{ d.used_gb | round }} / {{ d.total_gb | round }} GB ({{ d.percent }}%)

              {% endfor %}
          - type: entities
            title: Internet Speed
            entities:
              - sensor.speedtest_download
              - sensor.speedtest_upload
              - sensor.speedtest_ping
          - type: markdown
            title: Temperatures
            content: >-
              {% for t in state_attr('sensor.khione_temps', 'temps') or [] %}
              **{{ t.name }}**: {{ t.c }}°C{% if t.hot %} ⚠️{% endif %}

              {% endfor %}
          - type: entities
            title: System
            entities:
              - entity: sensor.khione_system
                name: Updates pending
              - type: attribute
                entity: sensor.khione_system
                attribute: uptime
                name: Uptime
              - type: attribute
                entity: sensor.khione_system
                attribute: kernel
                name: Kernel
