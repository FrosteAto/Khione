views:
  - title: Recipes
    path: recipes
    icon: mdi:book-open-variant
    theme: khione
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            title: ✏️ Add or Edit a Recipe
            content: >-
              Leave Recipe ID blank to create a new recipe, or paste an
              existing one's ID to edit it. Batch size and "Cooked Fresh"
              only matter for dinner recipes meant for the rotation.
          - type: entities
            entities:
              - input_text.khione_recipe_id
              - input_text.khione_recipe_name
              - input_select.khione_recipe_meal_type
              - input_number.khione_recipe_kcal_min
              - input_number.khione_recipe_kcal_max
              - input_number.khione_recipe_protein_min
              - input_number.khione_recipe_protein_max
              - input_number.khione_recipe_batch
              - input_boolean.khione_recipe_fresh
              - input_text.khione_recipe_ingredients
              - input_text.khione_recipe_instructions
          - type: custom:mushroom-template-card
            primary: Save Recipe
            icon: mdi:content-save
            icon_color: green
            tap_action:
              action: perform-action
              perform_action: pyscript.khione_meals_save_recipe
              target: {}
              # No data: block -- tap_action data is static YAML, never
              # Jinja-rendered, so a templated value here would just send
              # the literal template text. The service reads every one of
              # the 11 recipe-form helpers itself.
          - type: custom:mushroom-template-card
            primary: Delete Recipe
            icon: mdi:delete
            icon_color: red
            tap_action:
              action: perform-action
              perform_action: pyscript.khione_meals_delete_recipe
              target: {}
              # No data: block, same reason as Save Recipe above -- the
              # service reads input_text.khione_recipe_id itself.

      - type: grid
        cards:
          - type: markdown
            title: 📖 Recipe IDs (for editing)
            content: >-
              {% for key in ['breakfast', 'lunch', 'snacks', 'dinner'] %}
              **{{ key | title }}:**
              {% for r in state_attr('sensor.khione_meals_recipes_' + key, 'recipes') or [] %}
              `{{ r.id }}` — {{ r.name }}

              {% endfor %}
              {% endfor %}
