frontend:
  themes: !include_dir_merge_named themes

command_line:
  - sensor:
      name: Khione System
      unique_id: khione_system
      command: "cat /config/snapshots/system.json"
      value_template: "{{ value_json.updates }}"
      unit_of_measurement: updates
      json_attributes:
        - updates
        - uptime
        - kernel
      scan_interval: 60
  - sensor:
      name: Khione Disks
      unique_id: khione_disks
      command: "cat /config/snapshots/disks.json"
      value_template: "{{ value_json.disks | length }}"
      unit_of_measurement: disks
      json_attributes:
        - disks
      scan_interval: 300
  - sensor:
      name: Khione Temps
      unique_id: khione_temps
      command: "cat /config/snapshots/temps.json"
      value_template: "{{ value_json.temps | length }}"
      unit_of_measurement: sensors
      json_attributes:
        - temps
      scan_interval: 60
  - binary_sensor:
      name: Khione Plex
      unique_id: khione_plex
      command: "curl -fsS -o /dev/null http://localhost:32400/identity && echo 0 || echo 1"
      payload_on: "0"
      payload_off: "1"
      command_timeout: 5
      scan_interval: 60
  - binary_sensor:
      name: Khione Cockpit
      unique_id: khione_cockpit
      command: "curl -fsSk -o /dev/null https://localhost:9090 && echo 0 || echo 1"
      payload_on: "0"
      payload_off: "1"
      command_timeout: 5
      scan_interval: 60
  # Backs the rss-news-card on the dashboard. Confirmed live against the
  # card's own source: it reads a per-feed sensor's "articles" json
  # attribute (title/link/pubDate per item) rather than fetching RSS
  # itself — data comes from the ha-rss systemd timer.
  - sensor:
      name: Khione RSS BBC
      unique_id: khione_rss_bbc
      command: "cat /config/snapshots/rss_bbc.json"
      value_template: "{{ value_json.articles | length }}"
      unit_of_measurement: articles
      json_attributes:
        - articles
      scan_interval: 300
  - sensor:
      name: Khione RSS Derbyshire
      unique_id: khione_rss_derbyshire
      command: "cat /config/snapshots/rss_derbyshire.json"
      value_template: "{{ value_json.articles | length }}"
      unit_of_measurement: articles
      json_attributes:
        - articles
      scan_interval: 300
  - sensor:
      # "ArchLinux" (one word) deliberately, not "Arch Linux" -- HA
      # auto-slugs the entity_id from this display name, and a two-word
      # name produces sensor.khione_rss_arch_linux (extra underscore),
      # not sensor.khione_rss_archlinux, which is what home-view.yaml and
      # unique_id both already assume. Confirmed live: BBC/Derbyshire's
      # single-word tails happened to slug correctly by coincidence; this
      # one didn't.
      name: Khione RSS ArchLinux
      unique_id: khione_rss_archlinux
      command: "cat /config/snapshots/rss_archlinux.json"
      value_template: "{{ value_json.articles | length }}"
      unit_of_measurement: articles
      json_attributes:
        - articles
      scan_interval: 300

template:
  - sensor:
      - name: Khione Clothing Recommendation
        unique_id: khione_clothing_recommendation
        icon: >-
          {% set cond = states('weather.home') %}
          {% set temp = state_attr('weather.home', 'temperature') | float(10) %}
          {% if cond in ['rainy', 'pouring', 'snowy', 'snowy-rainy'] %}
            mdi:umbrella
          {% elif temp < 5 %}
            mdi:coat-rack
          {% elif temp < 12 %}
            mdi:jacket
          {% else %}
            mdi:tshirt-crew
          {% endif %}
        state: >-
          {% set cond = states('weather.home') %}
          {% set temp = state_attr('weather.home', 'temperature') | float(10) %}
          {% set wind = state_attr('weather.home', 'wind_speed') | float(0) %}
          {% if cond in ['rainy', 'pouring'] %}
            Coat + umbrella — rain expected
          {% elif cond in ['snowy', 'snowy-rainy'] %}
            Coat, scarf, boots — snow expected
          {% elif temp < 2 %}
            Heavy coat, scarf, gloves ({{ temp | round }}°C)
          {% elif temp < 8 %}
            Coat or heavy jacket ({{ temp | round }}°C)
          {% elif temp < 14 %}
            Light jacket or jumper ({{ temp | round }}°C)
          {% elif temp < 20 %}
            Long sleeves, no jacket needed ({{ temp | round }}°C)
          {% else %}
            T-shirt weather ({{ temp | round }}°C)
          {% endif %}
          {%- if wind > 30 %} — windy, add a layer{% endif %}

pyscript:
  allow_all_imports: true
  hass_is_global: true

input_number:
  khione_weight_kg:
    name: Log Weight (kg)
    min: 30
    max: 300
    step: 0.1
    initial: 80
  khione_profile_age:
    name: Age
    min: 10
    max: 120
    step: 1
    initial: 30
  khione_profile_height:
    name: Height (cm)
    min: 100
    max: 250
    step: 1
    initial: 183
  khione_meals_preview_week:
    name: Preview Week
    min: 1
    max: 12
    step: 1
    initial: 1
  khione_recipe_kcal_min:
    name: Kcal Min
    min: 0
    max: 3000
    step: 10
    initial: 0
  khione_recipe_kcal_max:
    name: Kcal Max
    min: 0
    max: 3000
    step: 10
    initial: 0
  khione_recipe_protein_min:
    name: Protein Min (g)
    min: 0
    max: 300
    step: 1
    initial: 0
  khione_recipe_protein_max:
    name: Protein Max (g)
    min: 0
    max: 300
    step: 1
    initial: 0
  khione_recipe_batch:
    name: Batch Size
    min: 0
    max: 20
    step: 1
    initial: 0

input_select:
  khione_profile_sex:
    name: Sex
    options: ["male", "female"]
  khione_profile_activity:
    name: Activity Level
    options: ["1.2", "1.375", "1.55", "1.725"]
  khione_recipe_meal_type:
    name: Meal Type
    options: ["breakfast", "lunch", "snack", "dinner"]

input_boolean:
  khione_recipe_fresh:
    name: Cooked Fresh (not reheated leftovers)

input_text:
  khione_recipe_id:
    name: Recipe ID (leave blank to create new)
    max: 100
  khione_recipe_name:
    name: Recipe Name
    max: 200
  khione_recipe_ingredients:
    name: Ingredients
    max: 2000
  khione_recipe_instructions:
    name: Instructions
    max: 2000

lovelace:
  # resource_mode: yaml is required alongside resources: below, or the
  # list is silently ignored (confirmed against HA's own dashboards docs
  # after all three custom cards failed identically live -- this was
  # missing, which is why none of card-mod/mushroom/rss-news-card ever
  # actually registered as a usable resource).
  resource_mode: yaml
  resources:
    - url: /local/community/card-mod/card-mod.js
      type: module
    - url: /local/community/mushroom/mushroom.js
      type: module
    - url: /local/community/rss-news-card/rss-news-card.js
      type: module
  dashboards:
    khione-home:
      mode: yaml
      filename: dashboards/home-view.yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true
    khione-meals:
      mode: yaml
      filename: dashboards/meals-view.yaml
      title: Meals
      icon: mdi:food
      show_in_sidebar: true
    khione-recipes:
      mode: yaml
      filename: dashboards/recipes-view.yaml
      title: Recipes
      icon: mdi:book-open-variant
      show_in_sidebar: true
