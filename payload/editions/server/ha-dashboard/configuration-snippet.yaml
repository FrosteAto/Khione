frontend:
  themes: !include_dir_merge_named themes

recorder:
  exclude:
    entities:
      - sensor.khione_netnoise
      - sensor.khione_actions

panel_custom:
  - name: khione-weather-panel
    sidebar_title: Weather
    sidebar_icon: mdi:weather-partly-cloudy
    url_path: khione-weather
    module_url: /local/panels/weather.js
    embed_iframe: false
    trust_external_script: true
  - name: khione-home-panel
    sidebar_title: Home
    sidebar_icon: mdi:home
    url_path: khione-home
    module_url: /local/panels/home.js
    embed_iframe: false
  - name: khione-plants-panel
    sidebar_title: Plants
    sidebar_icon: mdi:flower
    url_path: khione-plants
    module_url: /local/panels/plants.js
    embed_iframe: false
  - name: khione-meals-panel
    sidebar_title: Meals
    sidebar_icon: mdi:food
    url_path: khione-meals
    module_url: /local/panels/meals.js
    embed_iframe: false
  - name: khione-recipes-panel
    sidebar_title: Recipes
    sidebar_icon: mdi:book-open-variant
    url_path: khione-recipes
    module_url: /local/panels/recipes.js
    embed_iframe: false
  - name: khione-security-panel
    sidebar_title: Security
    sidebar_icon: mdi:shield-lock
    url_path: khione-security
    module_url: /local/panels/security.js
    embed_iframe: false
  - name: khione-todo-panel
    sidebar_title: TODO
    sidebar_icon: mdi:note-multiple
    url_path: khione-todo
    module_url: /local/panels/todo.js
    embed_iframe: false
    trust_external_script: true

shell_command:
  khione_update_official: "touch /config/triggers/update-official.trigger"
  khione_update_aur: "touch /config/triggers/update-aur.trigger"
  khione_aide_accept: "touch /config/triggers/aide-accept.trigger"
  khione_shutdown: "touch /config/triggers/shutdown.trigger"

command_line:
  - sensor:
      name: Khione System
      unique_id: khione_system
      command: "cat /config/snapshots/system.json"
      value_template: "{{ value_json.updates }}"
      unit_of_measurement: updates
      json_attributes:
        - updates
        - security_updates
        - security_detail
        - uptime
        - kernel
        - load1
        - load5
        - load15
        - swap_used_gb
        - swap_total_gb
      scan_interval: 60
  - sensor:
      name: Khione Disks
      unique_id: khione_disks
      command: "cat /config/snapshots/disks.json"
      value_template: "{{ value_json.disks | length }}"
      unit_of_measurement: disks
      json_attributes:
        - disks
      scan_interval: 300
  - sensor:
      name: Khione Temps
      unique_id: khione_temps
      command: "cat /config/snapshots/temps.json"
      value_template: "{{ value_json.temps | length }}"
      unit_of_measurement: sensors
      json_attributes:
        - temps
      scan_interval: 60
  - sensor:
      name: Khione Security
      unique_id: khione_security
      command: "cat /config/snapshots/security.json"
      value_template: "{{ value_json.banned_ips | int + value_json.crowdsec_decisions | int }}"
      unit_of_measurement: blocks
      json_attributes:
        - banned_ips
        - crowdsec_decisions
        - aide_status
        - aide_last_run
        - aide_next_run
        - auditd_active
        - auditd_immutable
        - ufw_rules
        - active_sessions
        - last_ban_jail
        - last_ban_time
        - quad9_active
        - fail2ban_active
        - crowdsec_active
        - ban_list
        - crowdsec_decision_log
        - aide_diff
        - auditd_recent
      scan_interval: 60
  - sensor:
      name: Khione Netwatch
      unique_id: khione_netwatch
      command: "cat /config/snapshots/netwatch.json"
      value_template: "{{ value_json.unusual_outbound }}"
      unit_of_measurement: connections
      json_attributes:
        - unusual_outbound
        - unusual_detail
      scan_interval: 60
  - sensor:
      name: Khione Patching
      unique_id: khione_patching
      command: "cat /config/snapshots/patching.json"
      value_template: "{{ value_json.news_unread }}"
      unit_of_measurement: unread
      json_attributes:
        - last_sync
        - next_run
        - news_unread
        - aur_updates
        - aur_update_packages
      scan_interval: 60
  - sensor:
      name: Khione Netnoise
      unique_id: khione_netnoise
      command: "cat /config/snapshots/netnoise.json"
      value_template: "{{ value_json.events | length }}"
      unit_of_measurement: events
      json_attributes:
        - events
      scan_interval: 15
  - sensor:
      name: Khione Actions
      unique_id: khione_actions
      command: "cat /config/snapshots/khione_actions.json"
      value_template: "{{ value_json.action }}"
      json_attributes:
        - action
        - started_at
        - finished_at
        - success
        - output_tail
      scan_interval: 5
  - binary_sensor:
      name: Khione Plex
      unique_id: khione_plex
      command: "curl -fsS -o /dev/null http://localhost:32400/identity && echo 0 || echo 1"
      payload_on: "0"
      payload_off: "1"
      command_timeout: 5
      scan_interval: 60
  - binary_sensor:
      name: Khione Cockpit
      unique_id: khione_cockpit
      command: "curl -fsSk -o /dev/null https://localhost:9090 && echo 0 || echo 1"
      payload_on: "0"
      payload_off: "1"
      command_timeout: 5
      scan_interval: 60
  # Backs the Home panel's news section. Each feed is a json "articles"
  # attribute (title/link/pubDate per item) read directly by home.js —
  # data comes from the ha-rss systemd timer.
  - sensor:
      name: Khione RSS BBC
      unique_id: khione_rss_bbc
      command: "cat /config/snapshots/rss_bbc.json"
      value_template: "{{ value_json.articles | length }}"
      unit_of_measurement: articles
      json_attributes:
        - articles
      scan_interval: 300
  - sensor:
      name: Khione RSS Derbyshire
      unique_id: khione_rss_derbyshire
      command: "cat /config/snapshots/rss_derbyshire.json"
      value_template: "{{ value_json.articles | length }}"
      unit_of_measurement: articles
      json_attributes:
        - articles
      scan_interval: 300
  - sensor:
      # "ArchLinux" (one word) deliberately, not "Arch Linux" -- HA
      # auto-slugs the entity_id from this display name, and a two-word
      # name produces sensor.khione_rss_arch_linux (extra underscore),
      # not sensor.khione_rss_archlinux, which is what home.js and
      # unique_id both already assume. Confirmed live: BBC/Derbyshire's
      # single-word tails happened to slug correctly by coincidence; this
      # one didn't. Note this only gets a fresh install the right slug --
      # HA never re-slugs an already-registered entity_id from a later
      # config edit, so an existing install can still be stuck on the old
      # two-word slug (confirmed live); home.js reads both as a fallback.
      name: Khione RSS ArchLinux
      unique_id: khione_rss_archlinux
      command: "cat /config/snapshots/rss_archlinux.json"
      value_template: "{{ value_json.articles | length }}"
      unit_of_measurement: articles
      json_attributes:
        - articles
      scan_interval: 300

template:
  - sensor:
      - name: Khione Clothing Recommendation
        unique_id: khione_clothing_recommendation
        icon: >-
          {% set cond = states('weather.home') %}
          {% set temp = state_attr('weather.home', 'temperature') | float(10) %}
          {% if cond in ['rainy', 'pouring', 'snowy', 'snowy-rainy'] %}
            mdi:umbrella
          {% elif temp < 5 %}
            mdi:coat-rack
          {% elif temp < 12 %}
            mdi:jacket
          {% else %}
            mdi:tshirt-crew
          {% endif %}
        state: >-
          {% set cond = states('weather.home') %}
          {% set temp = state_attr('weather.home', 'temperature') | float(10) %}
          {% set wind = state_attr('weather.home', 'wind_speed') | float(0) %}
          {% if cond in ['rainy', 'pouring'] %}
            Coat + umbrella — rain expected
          {% elif cond in ['snowy', 'snowy-rainy'] %}
            Coat, scarf, boots — snow expected
          {% elif temp < 2 %}
            Heavy coat, scarf, gloves ({{ temp | round }}°C)
          {% elif temp < 8 %}
            Coat or heavy jacket ({{ temp | round }}°C)
          {% elif temp < 14 %}
            Light jacket or jumper ({{ temp | round }}°C)
          {% elif temp < 20 %}
            Long sleeves, no jacket needed ({{ temp | round }}°C)
          {% else %}
            T-shirt weather ({{ temp | round }}°C)
          {% endif %}
          {%- if wind > 30 %} — windy, add a layer{% endif %}

pyscript:
  allow_all_imports: true
  hass_is_global: true

input_number:
  khione_meals_preview_week:
    name: Preview Week
    min: 1
    max: 12
    step: 1
    initial: 1
