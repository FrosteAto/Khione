backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = 0;
shadow-offset-y = -3;
shadow-exclude = [
  "window_type = 'tooltip'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'utility'"
];

fading = false;
corner-radius = 0;

wintypes = {
  dock = { shadow = true; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
