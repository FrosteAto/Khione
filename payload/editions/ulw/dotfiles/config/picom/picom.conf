# Deepwood: picom replaces xfwm4's built-in compositor (disabled in
# xfwm4.xml) because it's what actually gives Kitty's background_opacity
# an alpha visual to draw into. Kitty renders through GLX directly, and
# picom's xrender backend doesn't composite GLX clients' alpha correctly
# (transparency stays opaque even though the compositor is running fine) —
# glx is the backend that actually works with GL-rendered terminals.
backend = "glx";
vsync = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = 0;
shadow-offset-y = -3;
shadow-exclude = [
  "window_type = 'tooltip'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'utility'"
];

fading = false;
corner-radius = 0;

wintypes = {
  dock = { shadow = true; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
