# Deepwood: picom replaces xfwm4's built-in compositor (disabled in
# xfwm4.xml). xrender, not glx: this rice was captured on VirtualBox's
# VBoxVGA adapter, which has no working 3D acceleration, and picom's glx
# backend froze the whole guest there hard enough to need a VM kill. That
# means Kitty's background_opacity likely won't render (Kitty draws via
# GLX directly, and xrender doesn't composite GLX clients' alpha) — but a
# stable, opaque terminal beats a compositor that hangs the session. If a
# target machine has real 3D acceleration, glx can be tried there instead.
backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = 0;
shadow-offset-y = -3;
shadow-exclude = [
  "window_type = 'tooltip'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'utility'"
];

fading = false;
corner-radius = 0;

wintypes = {
  dock = { shadow = true; };
  dnd = { shadow = false; };
  popup_menu = { shadow = false; };
  dropdown_menu = { shadow = false; };
};
