# kitty, Deepwood rice. Colours live in themes/Deepwood.conf.
# Reload after editing with ctrl+shift+f5.

include themes/Deepwood.conf

# Font: same as the rest of the desktop. Nerd Font icons come built into kitty.
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5
disable_ligatures cursor

# Cursor: solid moss block, no trail animation
cursor_shape          block
cursor_trail          0

# Window: breathing room inside, the Deepwood title bar outside, slightly see-through
window_padding_width  6 10
background_opacity    0.9

# Splits: thin moss line around the focused one
window_border_width   1pt
draw_minimal_borders  yes
inactive_text_alpha   0.8

# Tabs: flat blocks along the top, current one on moss (like the workspaces)
tab_bar_edge          top
tab_bar_style         separator
tab_separator         " "
tab_bar_min_tabs      2
tab_bar_margin_height 0 6
tab_title_template    " {index} {bell_symbol}{activity_symbol}{title[:28]} "
active_tab_font_style bold
inactive_tab_font_style normal
bell_on_tab           "! "
tab_activity_symbol   "• "

# Quiet bell: flash the border brown instead of beeping
enable_audio_bell     no
window_alert_on_bell  yes

url_style             straight
scrollback_lines      10000
