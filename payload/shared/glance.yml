server:
  port: 8080
  assets-path: /var/lib/glance/assets

# Earthy naturey theme. Colors are HSL: "hue saturation lightness".
theme:
  light: true
  custom-css-file: /assets/custom.css
  background-color: 67 19 72 # off-white sage (from #C2C5AA)
  primary-color: 74 19 32 # olive (from #656D4A)
  positive-color: 90 26 34 # leafy green
  negative-color: 27 55 40 # warm brown (from #582F0E)
  contrast-multiplier: 1.1
  presets:
    forest-dark:
      background-color: 90 20 16 # deep forest green (from #333D29)
      primary-color: 73 19 60 # sage (from #A4AC86)
      positive-color: 74 19 45 # olive
      negative-color: 27 55 45 # warm brown
      contrast-multiplier: 1.1

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h

          - type: calendar
            first-day-of-week: monday

          - type: weather
            location: Derby, United Kingdom
            units: metric
            hour-format: 24h

          - type: markets
            title: Investments
            markets:
              - symbol: 0P0000UGLG.L
                name: ESG Dev World
              - symbol: 0P0000TKZO.L
                name: LifeStrategy 100
              - symbol: 0P0000KM1Y.L
                name: Japan Index
              - symbol: VUAG.L
                name: S&P 500 (VUAG)

      - size: full
        widgets:
          # Month-to-date outgoings vs the budget plan (50/25/25 from the
          # spreadsheet; tune INCOME_MONTHLY / BILLS_MONTHLY / BUDGET_MONTHLY
          # in /etc/glance-bank.env). Data comes from the glance-bank
          # systemd timer; link a bank with glance-bank-setup.
          - type: custom-api
            title: Monthly Spending
            cache: 1m
            url: http://localhost:8080/assets/budget.json
            template: |
              {{ if .JSON.Bool "configured" }}
                <div class="flex justify-between items-end">
                  <div>
                    <div class="color-highlight" style="font-size: 2.6rem; line-height: 1;">£{{ .JSON.Float "spent" | printf "%.0f" }}</div>
                    <div class="size-h5" style="margin-top: 0.3rem;">of £{{ .JSON.Float "budget" | printf "%.0f" }} out in {{ .JSON.String "month" }}</div>
                  </div>
                  <div style="text-align: right;">
                    <div class="size-h3 {{ if gt (.JSON.Float "projected") (.JSON.Float "budget") }}color-negative{{ else }}color-positive{{ end }}">£{{ .JSON.Float "projected" | printf "%.0f" }}</div>
                    <div class="size-h6">PROJECTED MONTH-END</div>
                  </div>
                </div>

                <div class="progress-bar" style="margin-top: 0.8rem;">
                  <div class="progress-value{{ if ge (.JSON.Int "percent") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .JSON.Int "percent" }}"></div>
                </div>

                <div class="flex justify-between text-center" style="margin-top: 1rem;">
                  <div>
                    <div class="color-highlight size-h3">£{{ .JSON.Float "left" | printf "%.0f" }}</div>
                    <div class="size-h6">LEFT TO SPEND</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h3">£{{ .JSON.Float "per_day_left" | printf "%.0f" }}/day</div>
                    <div class="size-h6">FOR {{ .JSON.Int "days_left" }} MORE DAYS</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h3">£{{ .JSON.Float "per_day_spent" | printf "%.0f" }}/day</div>
                    <div class="size-h6">ACTUAL DAILY AVERAGE</div>
                  </div>
                </div>

                <div class="flex justify-between items-end" style="margin-top: 1.2rem;">
                  <div class="size-h6">MONEY IN THIS MONTH</div>
                  <div class="size-h5">£{{ .JSON.Float "income" | printf "%.0f" }} of £{{ .JSON.Float "income_expected" | printf "%.0f" }} expected</div>
                </div>
                <div class="progress-bar" style="margin-top: 0.4rem;">
                  <div class="progress-value" style="--percent: {{ .JSON.Int "income_percent" }}"></div>
                </div>

                <div class="size-h6" style="margin-top: 1.2rem;">BUDGET PLAN (50 / 25 / 25)</div>
                <div class="flex justify-between text-center" style="margin-top: 0.5rem;">
                  <div>
                    <div class="color-highlight size-h4">£{{ .JSON.Float "bills" | printf "%.0f" }}</div>
                    <div class="size-h6">BILLS</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h4">£{{ .JSON.Float "food" | printf "%.0f" }}</div>
                    <div class="size-h6">FOOD</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h4">£{{ .JSON.Float "wants" | printf "%.0f" }}</div>
                    <div class="size-h6">WANTS</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h4">£{{ .JSON.Float "savings" | printf "%.0f" }}</div>
                    <div class="size-h6">SAVINGS</div>
                  </div>
                </div>

                <div class="size-h6" style="margin-top: 0.8rem;">SYNCED {{ .JSON.String "synced" }}{{ if .JSON.Bool "stale" }} · <span class="color-negative">SYNC FAILING — SHOWING CACHED DATA</span>{{ end }}</div>
              {{ else }}
                <p class="color-negative">Bank not linked — run: sudo glance-bank-setup</p>
              {{ end }}

          # One news widget, tab per feed.
          - type: group
            widgets:
              - type: rss
                title: BBC UK News
                limit: 8
                collapse-after: 4
                cache: 1h
                feeds:
                  - url: https://feeds.bbci.co.uk/news/uk/rss.xml

              - type: rss
                title: Derbyshire Live
                limit: 8
                collapse-after: 4
                cache: 1h
                feeds:
                  - url: https://www.derbytelegraph.co.uk/news/?service=rss

          - type: rss
            title: Arch Linux News
            limit: 5
            collapse-after: 3
            cache: 3h
            feeds:
              - url: https://archlinux.org/feeds/news/

      - size: small
        widgets:
          - type: monitor
            title: Services
            cache: 1m
            sites:
              - title: Plex
                url: http://@@GLANCE_HOST@@:32400/web
                check-url: http://localhost:32400/identity
                icon: di:plex
              - title: Cockpit
                url: https://@@GLANCE_HOST@@:9090
                check-url: https://localhost:9090
                allow-insecure: true
                icon: di:cockpit
              - title: Home Assistant
                url: http://@@GLANCE_HOST@@:8123
                check-url: http://localhost:8123
                icon: di:home-assistant

          - type: server-stats
            servers:
              - type: local
                name: FrosteArch Server

          # All disks, always visible (server-stats only shows disks on
          # hover). Data comes from the glance-disks systemd timer.
          - type: custom-api
            title: Disks
            cache: 5m
            url: http://localhost:8080/assets/disks.json
            template: |
              <ul class="list list-gap-10">
              {{ range .JSON.Array "disks" }}
                <li>
                  <div class="flex justify-between items-end">
                    <div class="size-h4 color-highlight text-truncate">{{ .String "path" }}</div>
                    <div class="size-h5">{{ .Float "used_gb" | printf "%.0f" }} / {{ .Float "total_gb" | printf "%.0f" }} GB</div>
                  </div>
                  <div class="progress-bar">
                    <div class="progress-value{{ if ge (.Int "percent") 85 }} progress-value-notice{{ end }}" style="--percent: {{ .Int "percent" }}"></div>
                  </div>
                </li>
              {{ end }}
              </ul>

          # Data comes from the glance-speedtest systemd timer (every 3h).
          - type: custom-api
            title: Internet Speed
            cache: 2m
            url: http://localhost:8080/assets/speedtest.json
            template: |
              {{ if eq .Response.StatusCode 200 }}
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">{{ printf "%.0f" (.JSON.Float "download_mbps") }}</div>
                  <div class="size-h6">DOWN MBPS</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ printf "%.0f" (.JSON.Float "upload_mbps") }}</div>
                  <div class="size-h6">UP MBPS</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ printf "%.0f" (.JSON.Float "ping") }}</div>
                  <div class="size-h6">PING MS</div>
                </div>
              </div>
              {{ else }}
              <p class="size-h5">Waiting for the first speed test — it runs a couple of minutes after boot.</p>
              {{ end }}

          # CPU / NVMe / disk temperatures from /sys/class/hwmon, via the
          # glance-temps systemd timer.
          - type: custom-api
            title: Temperatures
            cache: 1m
            url: http://localhost:8080/assets/temps.json
            template: |
              {{ $temps := .JSON.Array "temps" }}
              {{ if gt (len $temps) 0 }}
              <div class="flex justify-between text-center">
                {{ range $temps }}
                <div>
                  <div class="size-h3 {{ if .Bool "hot" }}color-negative{{ else }}color-highlight{{ end }}">{{ .Int "c" }}°C</div>
                  <div class="size-h6">{{ .String "name" }}</div>
                </div>
                {{ end }}
              </div>
              {{ else }}
              <p class="size-h5">No temperature sensors found.</p>
              {{ end }}

          # Pending pacman updates, uptime and kernel. Data comes from the
          # glance-system systemd timer.
          - type: custom-api
            title: System
            cache: 1m
            url: http://localhost:8080/assets/system.json
            template: |
              <div class="flex justify-between text-center">
                <div>
                  <div class="size-h3 {{ if gt (.JSON.Int "updates") 0 }}color-highlight{{ else }}color-positive{{ end }}">{{ .JSON.Int "updates" }}</div>
                  <div class="size-h6">UPDATES PENDING</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">{{ .JSON.String "uptime" }}</div>
                  <div class="size-h6">UPTIME</div>
                </div>
              </div>
              <div class="size-h6" style="margin-top: 0.8rem; text-align: center;">KERNEL {{ .JSON.String "kernel" }}</div>

          # Invisible: reloads the page every 30 minutes so a 24/7 wall
          # display stays fresh. Hidden by .hidden-widget in custom.css;
          # the reload interval lives in /var/lib/glance/assets/refresh.html.
          - type: iframe
            source: /assets/refresh.html
            height: 50
            css-class: hidden-widget

  # Finance page. Everything comes from finance.json, written by the same
  # glance-bank systemd timer that feeds the Home page's budget widget
  # (one GoCardless fetch per run — the free tier only allows ~4/day).
  # Month-vs-month and recurring data build up in the local history cache
  # (/var/lib/glance/bank-history.jsonl), so they fill in over time.
  - name: Finances
    columns:
      - size: small
        widgets:
          - type: custom-api
            title: Cash Flow
            cache: 1m
            url: http://localhost:8080/assets/finance.json
            template: |
              {{ if .JSON.Bool "configured" }}
                <div class="flex justify-between text-center">
                  <div>
                    <div class="size-h3 color-positive">£{{ .JSON.Float "in" | printf "%.0f" }}</div>
                    <div class="size-h6">MONEY IN</div>
                  </div>
                  <div>
                    <div class="size-h3 color-highlight">£{{ .JSON.Float "out" | printf "%.0f" }}</div>
                    <div class="size-h6">MONEY OUT</div>
                  </div>
                  <div>
                    <div class="size-h3 {{ if .JSON.Bool "net_positive" }}color-positive{{ else }}color-negative{{ end }}">£{{ .JSON.Float "net" | printf "%.0f" }}</div>
                    <div class="size-h6">{{ if .JSON.Bool "net_positive" }}KEPT{{ else }}OVERSPENT{{ end }}</div>
                  </div>
                </div>
                <div class="size-h6" style="margin-top: 0.8rem; text-align: center; text-transform: uppercase;">Kept {{ .JSON.Int "kept_percent" }}% of income in {{ .JSON.String "month" }}</div>
                {{ if .JSON.Bool "stale" }}
                <div class="size-h6 color-negative" style="margin-top: 0.8rem; text-align: center;">BANK SYNC FAILING — SHOWING CACHED DATA (LAST SYNC {{ .JSON.String "synced" }})</div>
                {{ end }}
              {{ else }}
                <p class="color-negative">Bank not linked — run: sudo glance-bank-setup</p>
              {{ end }}

          # Spend so far vs the same point last month; needs a month of
          # history in the cache before it has anything to compare.
          - type: custom-api
            title: vs Last Month
            cache: 1m
            url: http://localhost:8080/assets/finance.json
            template: |
              {{ if and (.JSON.Bool "configured") (.JSON.Bool "last_month.available") }}
                <div class="flex justify-between items-end">
                  <div class="size-h3 {{ if .JSON.Bool "last_month.up" }}color-negative{{ else }}color-positive{{ end }}">{{ if .JSON.Bool "last_month.up" }}▲{{ else }}▼{{ end }} {{ .JSON.Int "last_month.delta_percent" }}%</div>
                  <div class="size-h6" style="text-transform: uppercase;">vs {{ .JSON.String "last_month.name" }}</div>
                </div>
                <div class="flex justify-between text-center" style="margin-top: 0.8rem;">
                  <div>
                    <div class="color-highlight size-h4">£{{ .JSON.Float "out" | printf "%.0f" }}</div>
                    <div class="size-h6">SO FAR</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h4">£{{ .JSON.Float "last_month.out_to_date" | printf "%.0f" }}</div>
                    <div class="size-h6">SAME POINT</div>
                  </div>
                  <div>
                    <div class="color-highlight size-h4">£{{ .JSON.Float "last_month.out_total" | printf "%.0f" }}</div>
                    <div class="size-h6">FULL MONTH</div>
                  </div>
                </div>
              {{ else }}
                <p class="size-h5">Not enough history yet — this fills in once a full previous month is in the cache.</p>
              {{ end }}

          # This month's outgoings bucketed by the keyword->category map in
          # /usr/local/bin/glance-bank (CATEGORY_KEYWORDS) — anything the
          # map doesn't know lands in "Other", so grow it from there.
          - type: custom-api
            title: Spending by Category
            cache: 1m
            url: http://localhost:8080/assets/finance.json
            template: |
              {{ if .JSON.Bool "configured" }}
                <ul class="list list-gap-10">
                {{ range .JSON.Array "categories" }}
                  <li title="{{ .Int "count" }} transactions">
                    <div class="flex justify-between items-end">
                      <div class="size-h5 color-highlight text-truncate">{{ .String "name" }}</div>
                      <div class="size-h6" style="white-space: nowrap; margin-left: 0.6rem;">£{{ .Float "total" | printf "%.0f" }} · {{ .Int "share" }}%</div>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-value" style="--percent: {{ .Int "percent" }}"></div>
                    </div>
                  </li>
                {{ end }}
                </ul>
              {{ else }}
                <p class="color-negative">Bank not linked — run: sudo glance-bank-setup</p>
              {{ end }}

          # Budget-plan constants: annual salary (take-home estimated via UK
          # PAYE tax + NI in glance-weight-server, used as expected income
          # AND the monthly spending budget), planned bills, and the
          # needs/wants/savings split. Saving posts to the helper (:8081),
          # which writes finance-constants.json; glance-bank.path then
          # re-runs glance-bank so every finance widget rebuilds.
          - type: custom-api
            title: Budget Settings
            cache: 5s
            url: http://localhost:8080/assets/finance-constants.json
            template: |
              {{ if .JSON.Bool "configured" }}
                <div class="flex justify-between text-center">
                  <div>
                    <div class="size-h4 color-highlight">£{{ .JSON.Float "salary" | printf "%.0f" }}</div>
                    <div class="size-h6">SALARY /YR</div>
                  </div>
                  <div title="after an estimated £{{ .JSON.Float "tax_monthly" | printf "%.0f" }}/month PAYE tax + NI (no pension or student loan)">
                    <div class="size-h4 color-highlight">£{{ .JSON.Float "income" | printf "%.0f" }}</div>
                    <div class="size-h6">TAKE-HOME /MO</div>
                  </div>
                  <div>
                    <div class="size-h4 color-highlight">£{{ .JSON.Float "bills" | printf "%.0f" }}</div>
                    <div class="size-h6">BILLS /MO</div>
                  </div>
                </div>
                <div class="flex justify-between text-center" style="margin-top: 0.8rem;">
                  <div title="bills come out of this, leaving £{{ .JSON.Float "food_amt" | printf "%.0f" }} for food & essentials">
                    <div class="size-h4 color-highlight">£{{ .JSON.Float "needs_amt" | printf "%.0f" }}</div>
                    <div class="size-h6">NEEDS {{ .JSON.Int "needs_pct" }}%</div>
                  </div>
                  <div>
                    <div class="size-h4 color-highlight">£{{ .JSON.Float "wants_amt" | printf "%.0f" }}</div>
                    <div class="size-h6">WANTS {{ .JSON.Int "wants_pct" }}%</div>
                  </div>
                  <div>
                    <div class="size-h4 color-highlight">£{{ .JSON.Float "savings_amt" | printf "%.0f" }}</div>
                    <div class="size-h6">SAVE {{ .JSON.Int "savings_pct" }}%</div>
                  </div>
                </div>
                <details style="margin-top: 0.6rem;">
                  <summary class="size-h6 color-subdue" style="cursor: pointer;">EDIT</summary>
                  <form action="http://@@GLANCE_HOST@@:8081/finance" method="get"
                    style="margin-top: 0.5rem; display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.5rem;">
                    <input type="hidden" name="back" value="http://@@GLANCE_HOST@@:8080/finances">
                    <label class="size-h6" style="grid-column: span 3;">SALARY £/YR
                      <input type="number" name="salary" step="0.01" min="0" max="10000000" value="{{ .JSON.Float "salary" | printf "%.2f" }}" required
                        style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                    </label>
                    <label class="size-h6" style="grid-column: span 3;">BILLS £/MO
                      <input type="number" name="bills" step="0.01" min="0" max="1000000" value="{{ .JSON.Float "bills" | printf "%.2f" }}" required
                        style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                    </label>
                    <label class="size-h6" style="grid-column: span 2;">NEEDS %
                      <input type="number" name="needs_pct" min="0" max="100" value="{{ .JSON.Int "needs_pct" }}" required
                        style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                    </label>
                    <label class="size-h6" style="grid-column: span 2;">WANTS %
                      <input type="number" name="wants_pct" min="0" max="100" value="{{ .JSON.Int "wants_pct" }}" required
                        style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                    </label>
                    <label class="size-h6" style="grid-column: span 2;">SAVE %
                      <input type="number" name="savings_pct" min="0" max="100" value="{{ .JSON.Int "savings_pct" }}" required
                        style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                    </label>
                    <button type="submit" title="The three percentages must add up to 100"
                      style="grid-column: 1 / -1; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.8rem; font: inherit; cursor: pointer;">Save</button>
                  </form>
                </details>
              {{ else }}
                <p class="size-h5">Waiting for first values — is the glance-weight service running?</p>
              {{ end }}

      - size: full
        widgets:
          # Outgoings this month grouped by merchant, bars scaled against
          # the biggest one. Hover a name for its share of total spending.
          - type: custom-api
            title: Where The Money Goes
            cache: 1m
            url: http://localhost:8080/assets/finance.json
            template: |
              {{ if .JSON.Bool "configured" }}
                <ul class="list list-gap-14">
                {{ range .JSON.Array "merchants" }}
                  <li title="{{ .Int "share" }}% of this month's spending">
                    <div class="flex justify-between items-end">
                      <div class="size-h4 color-highlight text-truncate">{{ .String "name" }}</div>
                      <div class="size-h5" style="white-space: nowrap; margin-left: 0.6rem;">£{{ .Float "total" | printf "%.2f" }} · {{ .Int "count" }}×</div>
                    </div>
                    <div class="progress-bar">
                      <div class="progress-value" style="--percent: {{ .Int "percent" }}"></div>
                    </div>
                  </li>
                {{ end }}
                </ul>
              {{ else }}
                <p class="color-negative">Bank not linked — run: sudo glance-bank-setup</p>
              {{ end }}

          - type: custom-api
            title: Recent Transactions
            cache: 1m
            url: http://localhost:8080/assets/finance.json
            template: |
              {{ if .JSON.Bool "configured" }}
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                  <tbody>
                    {{ range .JSON.Array "recent" }}
                    <tr style="border-top: 1px solid rgba(128, 128, 128, 0.25);">
                      <td class="size-h5" style="padding: 0.45rem 0.4rem; white-space: nowrap;">{{ .String "date" }}</td>
                      <td class="size-h5 color-highlight" style="padding: 0.45rem 0.4rem;">{{ .String "name" }}</td>
                      <td class="size-h5 {{ if .Bool "in" }}color-positive{{ end }}" style="padding: 0.45rem 0.4rem; text-align: right; white-space: nowrap;">{{ if .Bool "in" }}+{{ else }}−{{ end }}£{{ .String "amount" }}</td>
                    </tr>
                    {{ end }}
                  </tbody>
                </table>
                <div class="size-h6" style="margin-top: 0.8rem;">SYNCED {{ .JSON.String "synced" }}{{ if .JSON.Bool "stale" }} · <span class="color-negative">SYNC FAILING — SHOWING CACHED DATA</span>{{ end }}</div>
              {{ end }}

      - size: small
        widgets:
          # Spend per day over the last 30 days; hover a bar for the date
          # and amount.
          - type: custom-api
            title: Daily Spending
            cache: 1m
            url: http://localhost:8080/assets/finance.json
            template: |
              {{ if .JSON.Bool "configured" }}
                <div class="flex items-end" style="gap: 2px; height: 4.5rem;">
                  {{ range .JSON.Array "daily" }}
                  <div title="{{ .String "date" }} · £{{ .Float "amount" | printf "%.2f" }}" style="flex: 1 1 0; min-width: 0; height: {{ .Int "percent" }}%; min-height: 3px; border-radius: 2px 2px 0 0; background: var(--color-primary); opacity: {{ if gt (.Float "amount") 0.0 }}0.85{{ else }}0.25{{ end }};"></div>
                  {{ end }}
                </div>
                <div class="flex justify-between size-h6" style="margin-top: 0.4rem;">
                  <div>30 DAYS AGO</div>
                  <div>TODAY</div>
                </div>
              {{ end }}

          - type: custom-api
            title: Biggest Purchases
            cache: 1m
            url: http://localhost:8080/assets/finance.json
            template: |
              {{ if .JSON.Bool "configured" }}
                {{ $big := .JSON.Array "biggest" }}
                {{ if gt (len $big) 0 }}
                  <ul class="list list-gap-10">
                  {{ range $big }}
                    <li class="flex justify-between items-end">
                      <div style="min-width: 0;">
                        <div class="size-h5 color-highlight text-truncate">{{ .String "name" }}</div>
                        <div class="size-h6">{{ .String "date" }}</div>
                      </div>
                      <div class="size-h4" style="white-space: nowrap; margin-left: 0.6rem;">£{{ .Float "amount" | printf "%.2f" }}</div>
                    </li>
                  {{ end }}
                  </ul>
                {{ else }}
                  <p class="size-h5">Nothing spent this month yet.</p>
                {{ end }}
              {{ end }}

          # Same merchant + steady amount + roughly monthly cadence,
          # detected from the history cache. Hover for the last payment
          # date.
          - type: custom-api
            title: Recurring Payments
            cache: 1m
            url: http://localhost:8080/assets/finance.json
            template: |
              {{ if .JSON.Bool "configured" }}
                {{ $rec := .JSON.Array "recurring" }}
                {{ if gt (len $rec) 0 }}
                  <div class="flex justify-between items-end">
                    <div class="size-h3 color-highlight">£{{ .JSON.Float "recurring_total" | printf "%.0f" }}</div>
                    <div class="size-h6">PER MONTH</div>
                  </div>
                  <ul class="list list-gap-10" style="margin-top: 0.8rem;">
                  {{ range $rec }}
                    <li class="flex justify-between items-end">
                      <div class="size-h5 color-highlight text-truncate" title="last paid {{ .String "last" }}">{{ .String "name" }}</div>
                      <div class="size-h5" style="white-space: nowrap; margin-left: 0.6rem;">£{{ .Float "amount" | printf "%.2f" }}</div>
                    </li>
                  {{ end }}
                  </ul>
                {{ else }}
                  <p class="size-h5">No recurring payments spotted yet — detection needs two months of history.</p>
                {{ end }}
              {{ end }}

  # Smart Home page. hass.json comes from the glance-hass poller (1-min
  # timer, plus an instant rebuild after each toggle). Buttons hit the
  # :8081 helper's /hass endpoint, which toggles the HA group and
  # redirects back here. Needs HASS_TOKEN in /etc/glance-hass.env.
  - name: Smart Home
    columns:
      - size: full
        widgets:
          - type: custom-api
            title: Groups
            cache: 5s
            url: http://localhost:8080/assets/hass.json
            template: |
              {{ if .JSON.Bool "configured" }}
                {{ $groups := .JSON.Array "groups" }}
                {{ if gt (len $groups) 0 }}
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.8rem;">
                  {{ range $groups }}
                  <div style="border: 1px solid rgba(128, 128, 128, 0.3); border-radius: 6px; padding: 0.8rem;">
                    <div class="flex justify-between items-center" style="gap: 0.6rem;">
                      <div style="min-width: 0;">
                        <div class="size-h4 text-truncate {{ if .Bool "on" }}color-highlight{{ else }}color-subdue{{ end }}">{{ .String "name" }}</div>
                        <div class="size-h6 color-subdue">
                          {{ if .Bool "unavailable" }}UNAVAILABLE{{ else if .Bool "on" }}ON{{ else }}OFF{{ end }}
                          · {{ .Int "members" }} DEVICE{{ if ne (.Int "members") 1 }}S{{ end }}
                          {{ if .Bool "has_power" }} · {{ .Float "watts" | printf "%.0f" }} W{{ end }}
                        </div>
                      </div>
                      <form action="http://@@GLANCE_HOST@@:8081/hass" method="get">
                        <input type="hidden" name="back" value="http://@@GLANCE_HOST@@:8080/smart-home">
                        <input type="hidden" name="entity" value="{{ .String "entity" }}">
                        <button type="submit"
                          style="background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.8rem; font: inherit; cursor: pointer; white-space: nowrap;">
                          {{ if .Bool "on" }}Turn off{{ else }}Turn on{{ end }}</button>
                      </form>
                    </div>
                  </div>
                  {{ end }}
                </div>
                {{ else }}
                <p class="size-h5">No groups found — create light or switch groups in Home Assistant under Settings → Devices & Services → Helpers.</p>
                {{ end }}
              {{ else }}
                <p class="size-h5">{{ .JSON.String "reason" }}</p>
              {{ end }}

      - size: small
        widgets:
          - type: custom-api
            title: Power Draw
            cache: 5s
            url: http://localhost:8080/assets/hass.json
            template: |
              {{ if .JSON.Bool "configured" }}
                {{ $devices := .JSON.Array "devices" }}
                {{ if gt (len $devices) 0 }}
                <div class="flex justify-between items-end">
                  <div class="color-highlight" style="font-size: 2.2rem; line-height: 1;">{{ .JSON.Float "total_watts" | printf "%.0f" }}<span class="size-h5"> W</span></div>
                  <div class="size-h6">TOTAL MEASURED</div>
                </div>
                <ul class="list list-gap-10" style="margin-top: 0.8rem;">
                  {{ range $devices }}
                  <li class="flex justify-between items-end">
                    <div class="size-h5 text-truncate">{{ .String "name" }}</div>
                    <div class="size-h5 color-highlight" style="white-space: nowrap; margin-left: 0.6rem;">{{ .Float "watts" | printf "%.1f" }} W</div>
                  </li>
                  {{ end }}
                </ul>
                <div class="size-h6 color-subdue" style="margin-top: 0.6rem;">UPDATED {{ .JSON.String "synced" }}</div>
                {{ else }}
                <p class="size-h5">No power sensors found — plugs with power monitoring will show up here automatically.</p>
                {{ end }}
              {{ else }}
                <p class="size-h5">Waiting for Home Assistant…</p>
              {{ end }}

  # Meal-plan page. Day/week data comes from the glance-meals systemd
  # timer (4-week rotation anchored in /usr/local/bin/glance-meals).
  - name: Meals
    columns:
      - size: small
        widgets:
          - type: custom-api
            title: Today
            cache: 15m
            url: http://localhost:8080/assets/meals.json
            template: |
              <div class="size-h3 color-highlight">{{ .JSON.String "day_name" }}</div>
              <div class="size-h5">Week {{ .JSON.Int "week" }} of 4</div>
              <ul class="list list-gap-10" style="margin-top: 0.8rem;">
                <li>
                  <div class="size-h6">BREAKFAST</div>
                  <div class="size-h4 color-highlight">{{ .JSON.String "today.breakfast" }}</div>
                </li>
                <li>
                  <div class="size-h6">LUNCH</div>
                  <div class="size-h4 color-highlight">{{ .JSON.String "today.lunch" }}</div>
                </li>
                <li>
                  <div class="size-h6">SNACKS</div>
                  <div class="size-h4 color-highlight">{{ .JSON.String "today.snacks" }}</div>
                </li>
                <li>
                  <div class="size-h6">DINNER</div>
                  <div class="size-h4 color-highlight">{{ .JSON.String "today.dinner" }}</div>
                </li>
              </ul>

          # Estimated from the midpoints of each recipe's kcal/protein range.
          - type: custom-api
            title: Today's Macros
            cache: 15m
            url: http://localhost:8080/assets/meals.json
            template: |
              <div class="flex justify-between items-end">
                <div class="size-h3 color-highlight">~{{ .JSON.Int "kcal" }} kcal</div>
                <div class="size-h6">TARGET 1,600–1,800</div>
              </div>
              <div class="progress-bar" style="margin-top: 0.4rem;">
                <div class="progress-value" style="--percent: {{ .JSON.Int "kcal_percent" }}"></div>
              </div>
              <div class="flex justify-between items-end" style="margin-top: 1rem;">
                <div class="size-h3 color-highlight">~{{ .JSON.Int "protein" }}g protein</div>
                <div class="size-h6">TARGET 90–120g</div>
              </div>
              <div class="progress-bar" style="margin-top: 0.4rem;">
                <div class="progress-value" style="--percent: {{ .JSON.Int "protein_percent" }}"></div>
              </div>

          - type: html
            title: Targets
            source: |
              <div class="flex justify-between text-center">
                <div>
                  <div class="color-highlight size-h3">3× / week</div>
                  <div class="size-h6">RUNNING</div>
                </div>
                <div>
                  <div class="color-highlight size-h3">90 → 75 kg</div>
                  <div class="size-h6">WEIGHT GOAL</div>
                </div>
              </div>

          # Weigh-in tracker: the form posts to the glance-weight-server
          # helper (port 8081), which logs it and redirects back here.
          # Hover a number for the date it was logged.
          - type: custom-api
            title: Weight
            cache: 5s
            url: http://localhost:8080/assets/weight.json
            template: |
              {{ if .JSON.Bool "configured" }}
                <div class="flex items-end justify-between">
                  {{ range .JSON.Array "previous" }}
                  <div class="size-h4 color-subdue" title="{{ .String "date" }}">{{ .Float "kg" | printf "%.1f" }}</div>
                  {{ end }}
                  <div class="color-highlight" style="font-size: 2.2rem; line-height: 1;" title="{{ .JSON.String "current_date" }}">{{ .JSON.Float "current" | printf "%.1f" }}<span class="size-h5"> kg</span></div>
                </div>
                <div class="progress-bar" style="margin-top: 0.6rem;">
                  <div class="progress-value" style="--percent: {{ .JSON.Int "percent" }}"></div>
                </div>
                <div class="flex justify-between size-h6" style="margin-top: 0.3rem;">
                  <div>LOST {{ .JSON.Float "lost" | printf "%.1f" }} KG</div>
                  <div>{{ .JSON.Float "to_go" | printf "%.1f" }} KG TO 75</div>
                </div>
                <div class="flex justify-between size-h6 color-subdue" style="margin-top: 0.3rem;"
                  title="Mifflin-St Jeor maintenance calories at this weight for the profile saved below">
                  <div>MAINTENANCE</div>
                  <div>{{ .JSON.Int "maint" }} KCAL</div>
                </div>
              {{ else }}
                <p class="size-h5">No weigh-ins yet — log your first below.</p>
              {{ end }}
              <form action="http://@@GLANCE_HOST@@:8081/log" method="get" style="margin-top: 0.8rem; display: flex; gap: 0.5rem;">
                <input type="hidden" name="back" value="http://@@GLANCE_HOST@@:8080/meals">
                <input type="number" name="kg" step="0.1" min="30" max="300" placeholder="today's kg" required
                  style="flex: 1; min-width: 0; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                <button type="submit"
                  style="background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.8rem; font: inherit; cursor: pointer;">Log</button>
              </form>
              <details style="margin-top: 0.6rem;">
                <summary class="size-h6 color-subdue" style="cursor: pointer;">MAINTENANCE PROFILE</summary>
                <form action="http://@@GLANCE_HOST@@:8081/profile" method="get"
                  style="margin-top: 0.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                  <input type="hidden" name="back" value="http://@@GLANCE_HOST@@:8080/meals">
                  <label class="size-h6">AGE
                    <input type="number" name="age" min="10" max="120" value="{{ .JSON.Int "profile_age" }}" required
                      style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                  </label>
                  <label class="size-h6">HEIGHT (CM)
                    <input type="number" name="height_cm" min="100" max="250" value="{{ .JSON.Int "profile_height" }}" required
                      style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                  </label>
                  <label class="size-h6">SEX
                    <select name="sex"
                      style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                      <option value="male" {{ if eq (.JSON.String "profile_sex") "male" }}selected{{ end }}>Male</option>
                      <option value="female" {{ if eq (.JSON.String "profile_sex") "female" }}selected{{ end }}>Female</option>
                    </select>
                  </label>
                  <label class="size-h6">ACTIVITY
                    <select name="activity"
                      style="width: 100%; margin-top: 0.2rem; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.5rem; font: inherit;">
                      <option value="1.2" {{ if eq (.JSON.String "profile_activity") "1.2" }}selected{{ end }}>Sedentary</option>
                      <option value="1.375" {{ if eq (.JSON.String "profile_activity") "1.375" }}selected{{ end }}>Light</option>
                      <option value="1.55" {{ if eq (.JSON.String "profile_activity") "1.55" }}selected{{ end }}>Moderate</option>
                      <option value="1.725" {{ if eq (.JSON.String "profile_activity") "1.725" }}selected{{ end }}>Very active</option>
                    </select>
                  </label>
                  <button type="submit"
                    style="grid-column: 1 / -1; background: transparent; color: inherit; border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 4px; padding: 0.3rem 0.8rem; font: inherit; cursor: pointer;">Save</button>
                </form>
              </details>

      - size: full
        widgets:
          # Tonight's dinner with batch-cooking status and the full recipe.
          - type: custom-api
            title: Tonight
            cache: 15m
            url: http://localhost:8080/assets/meals.json
            template: |
              <div class="flex justify-between items-end">
                <div class="size-h2 color-highlight">{{ .JSON.String "tonight.name" }}</div>
                <div class="size-h4 {{ if eq (.JSON.String "tonight.kind") "cook" }}color-positive{{ else }}color-subdue{{ end }}">{{ .JSON.String "tonight.status" }}</div>
              </div>
              <div class="size-h5 color-subdue" style="margin-top: 0.2rem;">{{ .JSON.String "tonight.detail" }}</div>
              <div class="size-h6" style="margin-top: 0.8rem;">INGREDIENTS</div>
              <p class="size-h5" style="margin-top: 0.2rem;">{{ .JSON.String "tonight.ingredients" }}</p>
              <div class="size-h6" style="margin-top: 0.6rem;">METHOD</div>
              <p class="size-h5" style="margin-top: 0.2rem;">{{ .JSON.String "tonight.instructions" }}</p>
              <div class="size-h6" style="margin-top: 0.8rem;">TOMORROW · {{ .JSON.String "tonight.tomorrow" }}</div>

          - type: custom-api
            title: This Week
            cache: 15m
            url: http://localhost:8080/assets/meals.json
            template: |
              <div class="size-h5">Week {{ .JSON.Int "week" }} of 4 · Week {{ .JSON.Int "next_week" }} starts Monday</div>
              <table style="width: 100%; border-collapse: collapse; text-align: left; margin-top: 0.6rem;">
                <thead>
                  <tr class="size-h6">
                    <th style="padding: 0.3rem 0.4rem;"></th>
                    <th style="padding: 0.3rem 0.4rem;">BREAKFAST</th>
                    <th style="padding: 0.3rem 0.4rem;">LUNCH</th>
                    <th style="padding: 0.3rem 0.4rem;">SNACKS</th>
                    <th style="padding: 0.3rem 0.4rem;">DINNER</th>
                  </tr>
                </thead>
                <tbody>
                  {{ range .JSON.Array "days" }}
                  <tr {{ if .Bool "is_today" }}class="color-highlight"{{ end }} style="border-top: 1px solid rgba(128, 128, 128, 0.25);">
                    <td class="size-h5" style="padding: 0.5rem 0.4rem;">{{ .String "name" }}</td>
                    <td style="padding: 0.5rem 0.4rem;">{{ .String "breakfast" }}</td>
                    <td style="padding: 0.5rem 0.4rem;">{{ .String "lunch" }}</td>
                    <td style="padding: 0.5rem 0.4rem;">{{ .String "snacks" }}</td>
                    <td style="padding: 0.5rem 0.4rem;">{{ .String "dinner" }}</td>
                  </tr>
                  {{ end }}
                </tbody>
              </table>

          - type: custom-api
            title: Shopping List
            cache: 15m
            url: http://localhost:8080/assets/meals.json
            template: |
              <div class="size-h5">For week {{ .JSON.Int "week" }} of 4</div>
              <div class="flex" style="gap: 1.5rem; flex-wrap: wrap; margin-top: 0.6rem;">
                <div style="flex: 1; min-width: 11rem;">
                  <div class="size-h6">BREAKFAST</div>
                  <ul class="list list-gap-2" style="margin-top: 0.3rem;">
                    {{ range .JSON.Array "shopping_breakfast" }}<li class="size-h5">{{ .String "t" }}</li>{{ end }}
                  </ul>
                  <div class="size-h6" style="margin-top: 0.8rem;">LUNCH</div>
                  <ul class="list list-gap-2" style="margin-top: 0.3rem;">
                    {{ range .JSON.Array "shopping_lunch" }}<li class="size-h5">{{ .String "t" }}</li>{{ end }}
                  </ul>
                  <div class="size-h6" style="margin-top: 0.8rem;">SNACKS</div>
                  <ul class="list list-gap-2" style="margin-top: 0.3rem;">
                    {{ range .JSON.Array "shopping_snacks" }}<li class="size-h5">{{ .String "t" }}</li>{{ end }}
                  </ul>
                </div>
                <div style="flex: 1; min-width: 11rem;">
                  <div class="size-h6">DINNER</div>
                  <ul class="list list-gap-2" style="margin-top: 0.3rem;">
                    {{ range .JSON.Array "shopping_dinner" }}<li class="size-h5">{{ .String "t" }}</li>{{ end }}
                  </ul>
                </div>
              </div>

      - size: small
        widgets:
          - type: group
            widgets:
              - type: html
                title: Breakfast
                source: |
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Protein porridge + fruit</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~345 kcal · ~19g protein</p>
                      <p style="margin-top: 0.2rem;">½ cup oats, 200ml semi-skimmed milk, 2 heaped tbsp 0% Greek yoghurt, ½ banana or ½ cup berries.</p>
                      <p style="margin-top: 0.2rem;">Cook oats with milk. Stir in yoghurt after cooking and top with fruit.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Yoghurt + oats + fruit</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~315 kcal · ~27g protein</p>
                      <p style="margin-top: 0.2rem;">1 cup 0% Greek yoghurt, ⅓ cup oats, ½ banana or ½ cup berries.</p>
                      <p style="margin-top: 0.2rem;">Mix yoghurt, oats, and fruit in a bowl.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Marmite on toast + protein side</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~305–365 kcal · ~15–25g protein</p>
                      <p style="margin-top: 0.2rem;">2 slices wholemeal bread, thin spreading of Marmite, 200ml semi-skimmed milk or 1 protein drink.</p>
                      <p style="margin-top: 0.2rem;">Toast bread, spread Marmite thinly, and have milk or a protein drink alongside.</p>
                    </div>
                  </details>

              - type: html
                title: Lunch
                source: |
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Tuna mayo sandwich</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~335 kcal · ~35–40g protein</p>
                      <p style="margin-top: 0.2rem;">2 slices wholemeal bread, 1 tin tuna in spring water, 1 tbsp light mayo, black pepper.</p>
                      <p style="margin-top: 0.2rem;">Drain tuna, mix with mayo and pepper, and make the sandwich.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Chicken + pickle sandwich</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~330–380 kcal · ~30–35g protein</p>
                      <p style="margin-top: 0.2rem;">2 slices wholemeal bread, 100g cooked chicken slices, 1 tbsp pickle, optional cucumber or salad.</p>
                      <p style="margin-top: 0.2rem;">Layer chicken and pickle in the sandwich; add cucumber or salad if desired.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Hummus + chicken salad sandwich</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~350–400 kcal · ~28–32g protein</p>
                      <p style="margin-top: 0.2rem;">2 slices wholemeal bread, 1 heaped tbsp hummus, 75g cooked chicken, 1 handful salad.</p>
                      <p style="margin-top: 0.2rem;">Use hummus as the spread and add chicken plus salad.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Cheese + tomato/pickle sandwich</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~315 kcal · ~17g protein</p>
                      <p style="margin-top: 0.2rem;">2 slices wholemeal bread, 30g reduced-fat cheddar, ½ tomato, 1 tbsp pickle, optional 200ml milk.</p>
                      <p style="margin-top: 0.2rem;">Slice tomato, add cheese and pickle, and serve with milk if extra protein is needed.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Marmite + cucumber sandwich + protein drink</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~310–370 kcal · ~15–25g protein</p>
                      <p style="margin-top: 0.2rem;">2 slices wholemeal bread, thin spreading of Marmite, ¼ cucumber, 1 protein drink.</p>
                      <p style="margin-top: 0.2rem;">Spread Marmite, add cucumber slices, and have a protein drink alongside.</p>
                    </div>
                  </details>

              - type: html
                title: Snacks
                source: |
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Protein bar</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~180–230 kcal · ~15–22g protein</p>
                      <p style="margin-top: 0.2rem;">Best post-run or as a high-protein treat snack.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Protein savoury pack</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~80–180 kcal · ~10–25g protein</p>
                      <p style="margin-top: 0.2rem;">Jerky or chicken bite-style pack; convenient savoury protein.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Cereal/oat bar</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~90–180 kcal · ~2–6g protein</p>
                      <p style="margin-top: 0.2rem;">Useful pre-run carbohydrate snack.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Small chocolate bar / biscuit pack</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~100–250 kcal · ~1–5g protein</p>
                      <p style="margin-top: 0.2rem;">Treat option; keep portion-controlled.</p>
                    </div>
                  </details>
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">Mini Cheddars / baked crisps</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
                      <p class="color-subdue">~120–180 kcal · ~3–6g protein</p>
                      <p style="margin-top: 0.2rem;">Savoury treat option for variety.</p>
                    </div>
                  </details>

              - type: html
                title: Dinner
                source: |
                  <details style="margin-bottom: 0.6rem;">
                    <summary class="size-h4 color-highlight" style="cursor: pointer;">High-protein chilli</summary>
                    <div class="size-h5" style="margin-top: 0.3rem;">
